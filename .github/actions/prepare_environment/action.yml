name: Prepare Environment
description: A shared set of setup steps to prepare the runtime environment.
inputs:
  target_os:
    required: true
    description: The target OS that we're building for ("macos", "linux", "windows", or "wasm").
  ref:
    description: If set, the ref to checkout.
  install_test_deps:
    description: If true, dependencies needed for running tests will be installed.
  install_release_deps:
    description: If true, dependencies needed for building release artifacts will be installed (e.g., cargo-about for license generation).
  cache_key:
    description: If set, the cache key to use.  If unset, the cache key will be derived from the target OS.

runs:
  using: composite
  steps:
    - name: Make GitHub token available in the environment
      shell: bash
      run: echo "GH_TOKEN=${{ github.token }}" >> $GITHUB_ENV

    - name: Set up git for Windows
      if: ${{ inputs.target_os == 'windows' }}
      shell: bash
      run: git config --system core.longpaths true

    - name: Determine repository root
      id: repo-root
      shell: bash
      run: |
        # The action lives at <repo-root>/.github/actions/prepare_environment.
        # Derive the repository root from the action path.
        REPO_ROOT=$(cd "${{ github.action_path }}/../../.." && pwd)
        echo "path=$REPO_ROOT" >> $GITHUB_OUTPUT
        # Normalize $GITHUB_WORKSPACE through cd/pwd so that path formats
        # match on Windows (where $GITHUB_WORKSPACE uses backslashes but
        # pwd produces MSYS-style forward-slash paths).
        WORKSPACE=$(cd "$GITHUB_WORKSPACE" && pwd)
        if [ "$REPO_ROOT" = "$WORKSPACE" ]; then
          echo "is-workspace-root=true" >> $GITHUB_OUTPUT
        else
          echo "is-workspace-root=false" >> $GITHUB_OUTPUT
        fi

    - name: Isolate build caches and temporary files
      shell: bash
      run: |
        REPO_ROOT="${{ steps.repo-root.outputs.path }}"
        # Non-repository fixtures must not inherit the checkout's .git directory.
        temp_root="$RUNNER_TEMP/.work/nanowarp"
        cargo_root="$REPO_ROOT/.work/cargo-home"
        # rust-cache excludes dependencies stored inside the workspace on Unix.
        if [[ "$RUNNER_OS" != "Windows" ]]; then
          cargo_root="$temp_root/cargo-home"
        fi
        mkdir -p "$cargo_root/bin" "$REPO_ROOT/.work/rustup" \
          "$REPO_ROOT/.work/target" "$temp_root"
        for entry in "CARGO_HOME=$cargo_root" "RUSTUP_HOME=$REPO_ROOT/.work/rustup" \
          "CARGO_TARGET_DIR=$REPO_ROOT/.work/target"; do
          name="${entry%%=*}"
          value="${entry#*=}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            value="$(cygpath -m "$value")"
          fi
          echo "$name=$value" >> "$GITHUB_ENV"
        done
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          temp_root="$(cygpath -m "$temp_root")"
        fi
        for name in TEMP TMP TMPDIR; do
          echo "$name=$temp_root" >> "$GITHUB_ENV"
        done
        cargo_bin="$cargo_root/bin"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          cargo_bin="$(cygpath -m "$cargo_bin")"
        fi
        echo "$cargo_bin" >> "$GITHUB_PATH"

    # Materialize Git LFS objects
    - name: Fetch Git LFS objects
      shell: bash
      run: |
        cd "${{ steps.repo-root.outputs.path }}"
        git lfs install --local
        git lfs pull

    # Print a per-file listing of the LFS payloads in debug mode
    - name: Verify LFS payloads
      if: ${{ runner.debug == '1' }}
      shell: bash
      run: |
        cd "${{ steps.repo-root.outputs.path }}"
        git lfs ls-files --size

    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        workspaces: . -> .work/target
        # Make sure x86_64-unknown-linux-gnu and wasm32-unknown-unknown builds
        # don't share a cache, despite running on the same _host_ architecture.
        key: ${{ inputs.cache_key != '' && inputs.cache_key || inputs.target_os }}
        # Only cache runs on the main branch (caches on feature branches
        # are not reusable).
        save-if: ${{ github.ref == 'refs/heads/main' }}

    # The script pins the binstall version, verifies the archive against an
    # in-repo SHA-256, retries transient download failures, and skips the
    # download entirely when the pinned version is already present (e.g.
    # restored from a runner cache).
    - name: Install cargo-binstall
      shell: bash
      run: |
        cd "${{ steps.repo-root.outputs.path }}"
        ./script/install_cargo_binstall

    - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      if: ${{ inputs.target_os == 'macos' }}
      with:
        xcode-version: '26'

    - name: Use the Ubuntu archive mirror
      if: ${{ inputs.target_os == 'linux' || inputs.target_os == 'wasm' }}
      shell: bash
      run: |
        if [[ -f /etc/apt/apt-mirrors.txt ]]; then
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
        fi

    - name: Install dependencies
      shell: bash
      run: |
        cd "${{ steps.repo-root.outputs.path }}"
        if ${{ inputs.target_os == 'macos' }}; then
          if ${{ inputs.install_release_deps == 'true' }}; then
            ./script/install_cargo_release_deps
          else
            ./script/install_cargo_build_deps
          fi
        elif ${{ inputs.target_os == 'linux' }}; then
          # Update the apt cache before installing dependencies - it can be slow, so the install scripts
          # don't do it.
          sudo apt-get update -y

          if ${{ inputs.install_test_deps == 'true' }}; then
            # The CI workflow owns shell, Vim and nextest setup; omit developer tools.
            ./script/linux/install_runtime_deps
          elif ${{ inputs.install_release_deps == 'true' }}; then
            ./script/linux/install_build_deps
            ./script/install_cargo_release_deps
          else
            ./script/linux/install_build_deps
          fi
        elif ${{ inputs.target_os == 'windows' }}; then
          ./script/windows/install_build_deps.ps1
          if ${{ inputs.install_release_deps == 'true' }}; then
            ./script/install_cargo_release_deps
          fi
        elif ${{ inputs.target_os == 'wasm' }}; then
          # Update the apt cache before installing dependencies - it can be slow, so the install scripts
          # don't do it (to avoid doing it more than once).
          sudo apt update -y
          ./script/wasm/install_build_deps --check-only
        else
          echo "::error::Missing logic to install build dependencies for OS \"${{ inputs.target_os }}\""
          exit 1
        fi


    - name: Install prebuilt protoc for macOS
      if: ${{ inputs.target_os == 'macos' }}
      shell: bash
      run: |
        # Match script/linux/install_build_deps without upgrading Homebrew dependencies.
        version="25.1"
        protoc_dir="${{ steps.repo-root.outputs.path }}/.work/tools/protoc-$version"
        archive="$RUNNER_TEMP/.work/nanowarp/protoc-$version.zip"
        mkdir -p "$protoc_dir" "$(dirname "$archive")"
        if [[ ! -x "$protoc_dir/bin/protoc" ]]; then
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 120 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-osx-universal_binary.zip" \
            -o "$archive"
          unzip -oq "$archive" -d "$protoc_dir"
        fi
        "$protoc_dir/bin/protoc" --version
        echo "PROTOC=$protoc_dir/bin/protoc" >> "$GITHUB_ENV"
        echo "PROTOC_INCLUDE=$protoc_dir/include" >> "$GITHUB_ENV"
        echo "$protoc_dir/bin" >> "$GITHUB_PATH"

    - name: Install protoc for generating rust bindings of protobuf APIs
      if: ${{ inputs.target_os != 'macos' }}
      id: install_protoc
      # Install protoc for generating rust bindings of protobuf APIs.
      uses: ConorMacBride/install-package@3e7ad059e07782ee54fa35f827df52aae0626f30 # v1
      # Let the Windows winget fallback below handle a package-manager failure.
      continue-on-error: true
      with:
        choco: protoc

    - name: Install protoc via winget (fallback for Windows)
      if: ${{ inputs.target_os == 'windows' && steps.install_protoc.outcome == 'failure' }}
      shell: pwsh
      run: winget install Google.Protobuf

    - name: Fail if protoc install did not succeed
      # Windows has a fallback; the dedicated macOS install fails directly.
      if: ${{ inputs.target_os != 'windows' && inputs.target_os != 'macos' && steps.install_protoc.outcome == 'failure' }}
      shell: bash
      run: |
        echo "::error::protoc install step failed on ${{ inputs.target_os }}"
        exit 1

