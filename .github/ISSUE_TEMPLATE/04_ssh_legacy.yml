name: Legacy SSH Issues? Use this template
description: "(Legacy) Issue template specialized for the circumstances where the shell doesn't bootstrap as a subshell over SSH"
labels: ["bug","area:ssh"]
body:
  - type: checkboxes
    attributes:
      label: "Pre-submit Checks"
      options:
        - label: "I have [searched NanoWarp SSH issues](https://github.com/Rycen7822/NanoWarp/issues?q=is%3Aissue+label%3Aarea%3Assh) and there are no duplicates"
          required: true
        - label: "I have [read the NanoWarp README](https://github.com/Rycen7822/NanoWarp/blob/main/README.md) and my issue is not covered there"
          required: true
        - label: "I have included relevant logs, with sensitive details redacted (optional)."
          required: false   
  - type: dropdown
    id: "os"
    attributes:
      label: "Operating system (OS)"
      multiple: false
      options:
        - "Select an OS"
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: "os-version"
    attributes:
      label: "Operating System and Version"
      description: "For example: Debian 11.2"
    validations:
      required: true
  - type: input
    id: "local-shell-version"
    attributes:
      label: "Local Shell Version"
      description: "Output of `echo $BASH_VERSION` or `echo $ZSH_VERSION`"
    validations:
      required: true
  - type: input
    id: "remote-shell-version"
    attributes:
      label: "Remote Shell Version"
      description: "Output of `echo $BASH_VERSION` or `echo $ZSH_VERSION`"
    validations:
      required: true
  - type: input
    id: "warp-version"
    attributes:
      label: "NanoWarp Version"
      description: "Copy the version from the bottom of NanoWarp Essentials, or run `nanowarp --version` with an installed package."
    validations:
      required: true
  - type: checkboxes
    id: "rcfiles"
    attributes:
      label: "Have you tried isolating your system and user rc files?"
      description: "If shell startup files appear related, describe any configuration changes you tried to isolate the issue."
      options:
      - label: "Yes"
  - type: textarea
    id: "screenshots-logs"
    attributes:
      label: "Screenshots, videos, and logs"
      description: "If applicable, add screenshots, videos, or logs to explain the problem. Redact sensitive details before posting."
    validations:
      required: false
  - type: textarea
    id: "xtrace-output"
    attributes:
      label: "Include SSH diagnostic output"
      description: "Include relevant output from `ssh -vvv YOUR-HOSTNAME-HERE` and the failing SSH command block. Redact sensitive details before posting."
    validations:
      required: true
  - type: dropdown
    id: "blocker"
    attributes:
      label: "Does this block you from using NanoWarp daily?"
      description: "All feedback will be reviewed, even if you select 'No'."
      multiple: false
      options:
        - "No"
        - "Yes, this issue prevents me from using NanoWarp daily."
    validations:
      required: true
  - type: dropdown
    id: "terminals"
    attributes:
      label: "Is this an issue only in NanoWarp?"
      description: "Verifying this issue doesn't happen in other terminals helps us to prioritize the fix"
      multiple: false
      options:
        - "Yes, I confirmed that this only happens in NanoWarp, not other terminals."
        - "No, this issue happens in NanoWarp and other terminals."
    validations:
      required: true
