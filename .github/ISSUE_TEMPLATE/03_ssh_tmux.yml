name: SSH with tmux Issues? Use this template
description: "Report problems with SSH shell integration using tmux"
labels: ["bug","area:ssh"]
body:
  - type: checkboxes
    attributes:
      label: "Pre-submit Checks"
      options:
        - label: "I have [searched NanoWarp SSH issues](https://github.com/Rycen7822/NanoWarp/issues?q=is%3Aissue+label%3Aarea%3Assh) and there are no duplicates"
          required: true
        - label: "I have [read the NanoWarp README](https://github.com/Rycen7822/NanoWarp/blob/main/README.md) and my issue is not covered there"
          required: true
        - label: "I have included relevant logs, with sensitive details redacted (optional)."
          required: false    
  - type: textarea
    id: "shell-output"
    attributes:
      label: "Include shell output"
      description: "Click on the top right icon of your terminal block, select `Copy`, and paste the contents here. Please redact any personal details."
      render: shell
    validations:
      required: true
  - type: textarea
    id: "screenshots-logs"
    attributes:
      label: "Screenshots, videos, and logs"
      description: "If applicable, add screenshots, videos, or logs to explain the problem. Redact sensitive details before posting."
    validations:
      required: false      
  - type: dropdown
    id: "os"
    attributes:
      label: "Operating system (OS)"
      multiple: false
      options:
        - "Select an OS"
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: "os-version"
    attributes:
      label: "Operating system and version"
      description: "For example: Debian 11.2"
    validations:
      required: true
  - type: input
    id: "warp-version"
    attributes:
      label: "NanoWarp Version"
      description: "Copy the version from the bottom of NanoWarp Essentials, or run `nanowarp --version` with an installed package."
    validations:
      required: false
